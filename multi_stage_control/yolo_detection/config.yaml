  port: 5010
  timeout_ms: 5000
  login_level: L4
  login_pin: admin
  sdk_path: /home/pc/VLA/python_sdk

continuous:
  max_result_age_ms: 1500.0
  require_stable_default: false
  stability_window: 3
  stable_max_step_mm: 4.0
