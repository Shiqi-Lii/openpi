  depth_topic: /camera/depth/image_raw
  camera_info_topic: /camera/color/camera_info
  capture_hz: 15.0
  sync_slop_s: 0.05

yolo:
  model_path: multi_stage_control/yolo_detection/best_model.pt
  device: null
  imgsz: 640
  conf: 0.25
  class_name: bottle

camera:
  width: 640
  height: 480
  frame_id: camera_color_optical_frame
  fx: 365.3350830078125
  fy: 365.2415771484375
  cx: 317.5589599609375
  cy: 241.07225036621094
  depth_scale_m_per_unit: 0.001
