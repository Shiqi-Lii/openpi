policy_host: 192.168.2.125
# policy_host: 192.168.168.150
policy_port: 8001
control_fps: 30
open_loop_horizon: 30
max_steps: 0
point_time_from_start: 0.0333

# ===启动回位=======================================================
# true: ROS2 连接后先让双臂回到以下位置并打开夹爪，完成后再启动策略推理。
# false: 不发送回位轨迹，直接启动策略推理。
home_on_start: true
# left_home_positions: [0.36, 0.36, 0.00, 1.92, -0.30, 0.00, 0.60]
# right_home_positions: [-0.36, 0.36, 0.00, 1.92, 0.30, 0.00, 2.00]
left_home_positions: [0.77, 0.24, 0.31, 2.2, -1.17, 0.20, 1.50]
right_home_positions: [-0.77, 0.24, -0.31, 2.2, 1.17, 0.20, 1.10]
home_time_from_start: 2.0
# ================================================================

# ===指令===========================================================
language_instruction: Pick up the bottle and place it in the blue box.
# ================================================================

# ===执行模式=======================================================
# 可选:
#   sync_chunk   普通 OpenPI chunk 推理
#   async_queue  异步动作队列预取
#   rtc_guidance RTC soft guidance
#   legato       Legato native continuation
execution_mode: sync_chunk

# async_queue 参数只在 execution_mode 为 async_queue 时生效。
action_refill_threshold: 6

# RTC 参数只在 execution_mode 为 rtc_guidance 时生效。
rtc_execute_horizon: 35
rtc_prefix_len: 5
rtc_guidance_weight: 5.0
rtc_decay_tau: 3.0
rtc_decay_end: 15
rtc_use_vjp: false
rtc_delay_buffer_size: 4
rtc_max_delay_steps: 12

# Legato 参数只在 execution_mode 为 legato 时生效。
# legato_prefix_len 对应论文里的 full-guidance delay d。
# legato_ramp_end 是 full guidance + ramp 的结束位置；例如 d=4, ramp=0 时设为 4。
legato_execute_horizon: 33
legato_prefix_len: 4
legato_ramp_end: 17
legato_delay_buffer_size: 4
legato_max_delay_steps: 10
# ================================================================

top_camera_topic: /camera/color/image_raw
# 单 top 相机模型不再订阅 wrist 相机。
# wrist_left_camera_topic: /wrist_left/image_raw

# YSRobot SDK connection. Joint state, joint commands, and gripper commands use this SDK.
ysrobot_sdk_path: /home/pc/VLA/python_sdk
ysrobot_host: 192.168.2.123
ysrobot_port: 5010
ysrobot_timeout_ms: 5000
ysrobot_login_level: L4
ysrobot_login_pin: admin
ysrobot_move_vel: 30
ysrobot_move_acc: 50
ysrobot_planner: pilz

joint_state_topic: /joint_states

left_joint_names:
  - left_joint1
  - left_joint2
  - left_joint3
  - left_joint4
  - left_joint5
  - left_joint6
  - left_joint7
right_joint_names:
  - right_joint1
  - right_joint2
  - right_joint3
  - right_joint4
  - right_joint5
  - right_joint6
  - right_joint7

left_trajectory_topic: /arm_left_controller/joint_trajectory
right_trajectory_topic: /arm_right_controller/joint_trajectory

# Gripper IO uses YSRobot SDK Modbus registers.
gripper_state_topic: /robot/api/io/state
gripper_cmd_topic: /robot/api/io/cmd
left_gripper_key: an_out_d9746
right_gripper_key: an_out_d9747
left_gripper_modbus_address: 9661
right_gripper_modbus_address: 9662
modbus_open_value: 1
modbus_closed_value: 2
gripper_default_value: 1.0
