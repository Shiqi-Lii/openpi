policy_host: 192.168.2.125
# policy_host: 192.168.168.150
policy_port: 8001
control_fps: 50
open_loop_horizon: 30
max_steps: 0
point_time_from_start: 0.1
active_arm: left
state_layout: left_tcp
require_left_tcp_pose: true
left_tcp_pose_topic: /planner/left_tcp_pose

# ===轨迹记录=======================================================
record_trajectory: false
trajectory_log_dir: run_logs
# ================================================================

# ===启动回位=======================================================
# 左手模式下只下发左臂回位和左夹爪打开命令。
home_on_start: true
left_home_positions: [0.69, 0.21, 0.29, 2.11, -1.19, 0.23, 1.48]
right_home_positions: [-0.69, 0.21, -0.29, 2.11, 1.19, 0.23, 1.10]
home_time_from_start: 2.0
# ================================================================

# ===指令===========================================================
language_instruction: Pick up the bottle and place it in the blue box.
# ================================================================

# ===执行模式=======================================================
# 可选: sync_chunk / async_queue / rtc_guidance / legato
execution_mode: async_queue
action_refill_threshold: 4

rtc_execute_horizon: 35
rtc_prefix_len: 5
rtc_guidance_weight: 8.0
rtc_decay_tau: 3.0
rtc_decay_end: 15
rtc_use_vjp: false
rtc_delay_buffer_size: 4
rtc_max_delay_steps: 12

legato_execute_horizon: 20
legato_prefix_len: 4
legato_ramp_end: 15
legato_delay_buffer_size: 4
legato_max_delay_steps: 10
# ================================================================

top_camera_topic: /camera/color/image_raw

ysrobot_sdk_path: /home/pc/VLA/python_sdk
ysrobot_host: 192.168.2.123
ysrobot_port: 5010
ysrobot_timeout_ms: 5000
ysrobot_login_level: L4
ysrobot_login_pin: admin
ysrobot_move_vel: 30
ysrobot_move_acc: 50
ysrobot_planner: pilz

joint_state_topic: /joint_states

left_joint_names:
  - left_joint1
  - left_joint2
  - left_joint3
  - left_joint4
  - left_joint5
  - left_joint6
  - left_joint7
right_joint_names:
  - right_joint1
  - right_joint2
  - right_joint3
  - right_joint4
  - right_joint5
  - right_joint6
  - right_joint7

left_trajectory_topic: /arm_left_controller/joint_trajectory
right_trajectory_topic: /arm_right_controller/joint_trajectory

gripper_state_topic: /robot/api/io/state
gripper_cmd_topic: /robot/api/io/cmd
left_gripper_key: an_out_d9746
right_gripper_key: an_out_d9747
left_gripper_modbus_address: 9661
right_gripper_modbus_address: 9662
modbus_open_value: 1
modbus_closed_value: 2
gripper_default_value: 1.0
